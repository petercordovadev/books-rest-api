services:
  api:
    build: .
    init: true
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_PATH: /app/data/db.json
      SEED_PATH: /app/seed/books.seed.json
    volumes:
      - books-data:/app/data
    restart: unless-stopped

volumes:
  books-data:
